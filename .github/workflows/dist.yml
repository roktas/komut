name: Publish plugin distribution

on:
  push:
    branches: [main]
    paths:
      - "*.go"
      - ".agents/plugins/**"
      - "bin/**"
      - "cmd/**"
      - "internal/**"
      - "plugins/**"
      - "scripts/build-dist.sh"
      - "go.mod"
      - ".github/workflows/dist.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-dist
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: |
          go test -race ./...
          go vet ./...
          sh -n bin/x scripts/build-dist.sh

      - name: Build distribution
        run: sh scripts/build-dist.sh "$RUNNER_TEMP/komut-dist"

      - name: Publish dist branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan dist
          git rm -rf .
          cp -R "$RUNNER_TEMP/komut-dist/." .
          git add --all
          git commit -m "build: update plugin distribution"
          git push --force origin dist
