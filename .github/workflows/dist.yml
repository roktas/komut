name: Publish plugin distribution

on:
  push:
    branches: [main]
    paths:
      - "*.go"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - "bin/**"
      - "cmd/**"
      - "internal/**"
      - "plugins/**"
      - "scripts/**"
      - "go.mod"
      - ".github/workflows/dist.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-dist
  cancel-in-progress: true

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test Windows launchers
        shell: pwsh
        run: |
          go test ./...
          go vet ./...

          New-Item -ItemType Directory -Force -Path "libexec/x/windows-amd64" | Out-Null
          go build -trimpath -ldflags="-s -w" -o "libexec/x/windows-amd64/x.exe" ./cmd/x

          $testHome = Join-Path $env:RUNNER_TEMP "komut-home"
          $project = Join-Path $testHome "project"
          $commands = Join-Path $project ".agents/commands"
          New-Item -ItemType Directory -Force -Path $commands | Out-Null
          Set-Content -Path (Join-Path $commands "hello.md") -Value 'Hello $1' -NoNewline
          $env:HOME = $testHome
          $env:USERPROFILE = $testHome

          Push-Location $project
          try {
            $output = & "$env:GITHUB_WORKSPACE\bin\x.cmd" '$x hello world'
            $status = $LASTEXITCODE
          } finally {
            Pop-Location
          }

          if ($status -ne 0) {
            throw "x.cmd exited with status $status"
          }
          if (($output -join "`n") -ne "Hello world") {
            throw "unexpected x.cmd output: $output"
          }

          $env:CLAUDE_PLUGIN_ROOT = $env:GITHUB_WORKSPACE
          $payload = @{ prompt = '$x hello world'; cwd = $project } | ConvertTo-Json -Compress
          $hookOutput = $payload | & "$env:GITHUB_WORKSPACE\plugins\claude\hooks\run.cmd"
          $hookStatus = $LASTEXITCODE
          if ($hookStatus -ne 0) {
            throw "Claude run.cmd exited with status $hookStatus"
          }
          $hook = ($hookOutput -join "`n") | ConvertFrom-Json
          if ($hook.hookSpecificOutput.hookEventName -ne "UserPromptSubmit") {
            throw "unexpected Claude hook event"
          }
          if ($hook.hookSpecificOutput.additionalContext -notmatch "Hello world") {
            throw "unexpected Claude hook context"
          }

  publish:
    needs: verify-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: |
          go test -race ./...
          go vet ./...
          unformatted=$(gofmt -l cmd internal *.go)
          if [ -n "$unformatted" ]; then
                  printf 'gofmt required:\n%s\n' "$unformatted" >&2
                  exit 1
          fi
          sh -n bin/x plugins/claude/hooks/run.cmd scripts/build-dist.sh scripts/smoke-dist.sh
          node --check plugins/opencode/src/index.js

      - name: Build distribution
        run: sh scripts/build-dist.sh "$RUNNER_TEMP/komut-dist"

      - name: Smoke test distribution
        run: sh scripts/smoke-dist.sh "$RUNNER_TEMP/komut-dist"

      - name: Publish dist branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan dist
          git rm -rf .
          cp -R "$RUNNER_TEMP/komut-dist/." .
          git add --all
          git commit -m "build: update plugin distribution"
          git push --force origin dist
